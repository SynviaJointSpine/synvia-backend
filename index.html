<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#06182b">
<meta name="description" content="Take the private SYNVIA Joint &amp; Spine Candidacy Quiz and discover whether a personalized consultation may be the right next step.">
<title>SYNVIA Joint &amp; Spine — Candidacy Quiz</title>
<style>
  :root{
    --navy:#06182b;
    --navy-2:#0b2d4b;
    --ink:#10283e;
    --muted:#647487;
    --line:#dce4e8;
    --teal:#18777e;
    --teal-2:#2d9aa0;
    --teal-soft:#e9f5f3;
    --gold:#c49a4a;
    --gold-2:#edcf8b;
    --cream:#fbf7ed;
    --card:#fffefa;
    --good:#1f9d63;
    --warm:#18777e;
    --cool:#c27b26;
    --low:#7c8a90;
    --radius:28px;
    --shadow:0 30px 80px rgba(0,10,24,.34),0 8px 28px rgba(0,10,24,.16);
    --shadow-sm:0 10px 28px rgba(0,10,24,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(850px 520px at 8% 4%,rgba(45,154,160,.22),transparent 60%),
      radial-gradient(760px 520px at 92% 12%,rgba(196,154,74,.22),transparent 62%),
      linear-gradient(145deg,#04111f 0%,var(--navy) 47%,#0a2941 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:34px 18px 70px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }
  body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none;filter:blur(2px)}
  body::before{width:260px;height:260px;left:-160px;bottom:8%;border:1px solid rgba(237,207,139,.16);box-shadow:0 0 0 38px rgba(237,207,139,.025),0 0 0 76px rgba(237,207,139,.018)}
  body::after{width:220px;height:220px;right:-140px;top:28%;border:1px solid rgba(45,154,160,.18);box-shadow:0 0 0 34px rgba(45,154,160,.025),0 0 0 68px rgba(45,154,160,.015)}
  .shell{width:100%;max-width:650px;position:relative;z-index:1}

  /* Header */
  .brand{text-align:center;color:#fff;margin:2px 0 24px}
  .wordmark{font-family:Georgia,"Times New Roman",serif;font-size:clamp(43px,9vw,70px);font-weight:400;letter-spacing:.18em;line-height:.95;margin-left:.18em;text-shadow:0 6px 24px rgba(0,0,0,.24)}
  .brand-sub{display:flex;align-items:center;justify-content:center;gap:15px;margin:12px auto 0;color:var(--gold-2);font-size:11px;font-weight:700;letter-spacing:.48em}
  .brand-sub::before,.brand-sub::after{content:"";width:54px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
  .brand-sub::after{background:linear-gradient(90deg,var(--gold),transparent)}
  .brand-sub b{color:#fff;font-weight:500}
  .brand-promise{margin:14px 0 0;color:rgba(255,255,255,.7);font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}

  /* Progress */
  .progress-wrap{margin:0 0 18px;padding:13px 16px 15px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.07);box-shadow:inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(12px)}
  .progress-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .progress-name{font-size:9px;font-weight:800;letter-spacing:.2em;color:rgba(255,255,255,.6)}
  .bar{height:7px;background:rgba(255,255,255,.13);border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--gold),var(--gold-2),#fff1bb);box-shadow:0 0 18px rgba(237,207,139,.5);transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .step-lbl{font-size:11px;color:#fff;font-weight:700;white-space:nowrap}

  /* Card */
  .card{
    background:linear-gradient(165deg,#fff 0%,var(--card) 52%,#fbfaf5 100%);border:1px solid rgba(237,207,139,.62);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:34px 32px 28px;animation:pop .42s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden
  }
  .card::before{content:"";position:absolute;left:28px;right:28px;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold-2),transparent)}
  .card::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-105px;top:-110px;background:radial-gradient(circle,rgba(237,207,139,.17),transparent 68%);pointer-events:none}
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.987)}to{opacity:1;transform:none}}
  .eyebrow{display:inline-flex;align-items:center;min-height:27px;padding:5px 10px;border:1px solid rgba(196,154,74,.32);border-radius:999px;background:var(--cream);font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#8b6625;margin:0 0 13px}
  h1.q{font-family:Georgia,"Times New Roman",serif;font-size:clamp(27px,5.5vw,36px);line-height:1.13;margin:0 0 8px;font-weight:600;letter-spacing:-.025em;color:var(--navy)}
  .sub{font-size:15px;color:var(--muted);margin:8px 0 22px;max-width:520px}

  /* Options */
  .opts{display:flex;flex-direction:column;gap:11px;margin-top:5px}
  .opt{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
    background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:18px;padding:14px 15px;
    font-size:15px;font-weight:700;color:var(--ink);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,background .18s ease;
  }
  .opt:hover{transform:translateY(-2px);border-color:rgba(196,154,74,.72);box-shadow:0 10px 24px rgba(8,32,53,.09);background:#fff}
  .opt .ico{font-size:20px;width:38px;height:38px;border-radius:12px;background:var(--cream);display:grid;place-items:center;text-align:center;flex:none;transition:background .18s ease,transform .18s ease}
  .opt.sel{border-color:var(--navy);background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;box-shadow:0 12px 28px rgba(6,24,43,.22)}
  .opt.sel .ico{background:rgba(237,207,139,.16);transform:scale(1.04)}
  .opt .tick{margin-left:auto;width:21px;height:21px;border-radius:50%;border:2px solid #cbd4da;flex:none;display:flex;align-items:center;justify-content:center}
  .opt.sel .tick{background:var(--gold);border-color:var(--gold)}
  .opt.sel .tick::after{content:"✓";color:var(--navy);font-size:12px;font-weight:1000}

  /* Body-area grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:5px}
  .grid .opt{flex-direction:column;text-align:center;justify-content:center;gap:9px;min-height:112px;padding:16px 10px}
  .grid .opt .ico{font-size:25px;width:46px;height:46px;border-radius:15px}
  .grid .opt .tick{display:none}

  /* Nav */
  .nav{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
  .back{background:none;border:none;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;padding:8px 4px}
  .back:hover{color:var(--navy)}
  .back:disabled{opacity:0;pointer-events:none}
  .hint{font-size:11px;color:#8a98a5;font-weight:600}
  .education-note{display:flex;gap:10px;align-items:flex-start;margin:17px 0 0;padding:13px 14px;border-radius:15px;background:var(--teal-soft);color:#3c6267;font-size:12px;line-height:1.48;text-align:left}
  .education-note .note-mark{width:24px;height:24px;flex:none;border-radius:8px;background:#fff;border:1px solid rgba(24,119,126,.2);display:grid;place-items:center;color:var(--teal);font-weight:900}
  .education-note b{color:var(--teal)}

  /* Inputs */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:800;color:var(--navy);margin:0 0 7px;letter-spacing:.03em}
  .field input, .field select{
    width:100%;padding:15px 14px;border:1px solid #d5dfe4;border-radius:14px;font-size:16px;
    font-family:inherit;color:var(--ink);background:#fff;transition:border-color .16s,box-shadow .16s,transform .16s
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(196,154,74,.13);transform:translateY(-1px)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .consent{font-size:11.5px;color:var(--muted);margin:10px 2px 0;line-height:1.48;text-align:center}
  .contact-card{margin-top:20px;padding:18px;border:1px solid rgba(237,207,139,.44);border-radius:18px;background:linear-gradient(145deg,var(--navy),#0d3553);box-shadow:0 14px 34px rgba(6,24,43,.16);color:#fff}
  .contact-title{margin:0 0 12px;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2)}
  .contact-list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
  .contact-list li{display:grid;grid-template-columns:64px 1fr;gap:9px;font-size:13px;line-height:1.45}
  .contact-list strong{color:rgba(255,255,255,.62)}
  .contact-list a{color:#fff;font-weight:750;text-decoration:none}
  .contact-list a:hover{text-decoration:underline}
  .cta:disabled{cursor:wait;opacity:.72;transform:none;box-shadow:none}
  .honeypot{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;overflow:hidden!important}

  /* CTA */
  .cta{
    width:100%;border:1px solid rgba(255,255,255,.24);border-radius:16px;padding:17px;font-size:15.5px;font-weight:900;cursor:pointer;
    background:linear-gradient(115deg,#ae8132,var(--gold-2) 48%,#c59642);color:var(--navy);
    box-shadow:0 14px 30px rgba(174,129,50,.28);transition:transform .16s,box-shadow .16s,filter .16s;margin-top:8px;position:relative;overflow:hidden
  }
  .cta::after{content:"";position:absolute;inset:-100% auto -100% -35%;width:24%;background:rgba(255,255,255,.42);transform:rotate(18deg);transition:left .5s ease}
  .cta:hover::after{left:115%}
  .cta:hover{transform:translateY(-2px);box-shadow:0 18px 38px rgba(174,129,50,.38);filter:saturate(1.08)}
  .cta:active{transform:translateY(0)}
  /* Conversion-led introduction */
  .intro-card{padding:42px 36px 34px;text-align:center}
  .intro-card h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(31px,6.2vw,45px);line-height:1.06;margin:0 auto 14px;font-weight:550;letter-spacing:-.03em;color:var(--navy);max-width:550px}
  .intro-card .sub{margin:0 auto 23px;max-width:510px;font-size:15px}
  .intro-proof{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:0 0 21px}
  .intro-proof span{padding:11px 7px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font-size:11px;font-weight:800}
  .intro-proof b{color:var(--teal);margin-right:3px}
  .medical-note{margin:13px auto 0;max-width:500px;color:#83909a;font-size:10.5px;line-height:1.45}
  /* Candidacy result */
  .eligibility-card{text-align:center;padding:42px 32px 34px}
  .eligibility-card .eyebrow{margin-bottom:18px}
  .eligibility-mark{
    width:78px;height:78px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--navy),#0d3553);border:2px solid var(--gold);
    box-shadow:0 0 0 9px rgba(196,154,74,.1),0 16px 36px rgba(6,24,43,.2);
    color:var(--gold-2);font-size:34px;font-weight:800
  }
  .eligibility-card.not-candidate .eligibility-mark{font-size:26px}
  .eligibility-card h1{font-family:Georgia,"Times New Roman",serif;color:var(--navy);font-size:clamp(29px,5.8vw,42px);line-height:1.08;margin:0 auto 12px;font-weight:550;max-width:520px}
  .result-lead{margin:0 auto 20px;max-width:500px;color:var(--muted);font-size:14px;line-height:1.55}
  .care-snapshot{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:19px 0;text-align:left}
  .snapshot-item{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fff}
  .snapshot-item span{display:block;color:#8b6625;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
  .snapshot-item b{display:block;color:var(--navy);font-size:12px;line-height:1.35}
  .journey{margin:19px 0 21px;border:1px solid rgba(196,154,74,.34);border-radius:18px;padding:17px;background:linear-gradient(145deg,#fffdf8,#f8f4e9);text-align:left}
  .journey-title{margin:0 0 12px;color:#8b6625;font-size:9px;font-weight:950;letter-spacing:.15em;text-transform:uppercase}
  .journey-step{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:9px 0;border-top:1px solid rgba(16,40,62,.08);color:var(--muted);font-size:12px;line-height:1.45}
  .journey-step:first-of-type{border-top:0;padding-top:0}
  .journey-step i{width:26px;height:26px;border-radius:9px;background:var(--navy);color:var(--gold-2);font-style:normal;font-weight:900;display:grid;place-items:center}
  .journey-step b{display:block;color:var(--ink);font-size:12.5px}
  .eligibility-card .cta{max-width:420px;margin-left:auto;margin-right:auto}
  .eligibility-card .mini-back{max-width:420px}
  .value-panel{position:relative;overflow:hidden;margin:0 0 24px;padding:22px;border:3px solid #d6aa53;border-radius:22px;background:linear-gradient(145deg,#fffdf8 0%,#f8edcf 100%);box-shadow:0 22px 48px rgba(6,24,43,.17),0 0 0 5px rgba(196,154,74,.1),inset 0 1px 0 #fff}
  .value-panel::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-85px;top:-92px;background:rgba(237,207,139,.24);box-shadow:0 0 0 25px rgba(237,207,139,.09);pointer-events:none}
  .value-panel-title{position:relative;z-index:1;display:inline-flex;align-items:center;margin:0 0 14px;border-radius:999px;padding:7px 11px;background:var(--navy);color:var(--gold-2);font-size:10px;font-weight:950;letter-spacing:.15em;text-transform:uppercase;box-shadow:0 7px 16px rgba(6,24,43,.14)}
  .simple-price{position:relative;z-index:1;display:flex;align-items:baseline;gap:13px;margin:0 0 17px;border:1px solid rgba(196,154,74,.55);border-radius:17px;padding:14px 16px;background:#fff;box-shadow:0 10px 24px rgba(6,24,43,.09)}
  .simple-price strong{font-family:Georgia,"Times New Roman",serif;color:var(--navy);font-size:42px;line-height:1}
  .simple-price del{font-family:Georgia,"Times New Roman",serif;color:#8b7070;font-size:26px;font-weight:600;text-decoration-thickness:3px;text-decoration-color:#a94747}
  .value-list{position:relative;z-index:1;display:grid;gap:8px;margin:0;padding:0;list-style:none}
  .value-list li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;color:var(--ink);font-size:12.5px;font-weight:700;line-height:1.45}
  .value-list li>span:first-child{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal);font-size:10px;font-weight:950}
  .value-list li>span:last-child{min-width:0;width:auto;height:auto;background:none;color:inherit;font-size:inherit;font-weight:inherit}
  /* Quiz-to-calendar booking experience */
  .booking-card{padding:0;overflow:hidden}
  .booking-card::before{display:none}
  .booking-hero{
    position:relative;padding:30px 32px 26px;color:#fff;overflow:hidden;
    background:
      radial-gradient(440px 210px at 88% -10%,rgba(237,207,139,.26),transparent 66%),
      linear-gradient(135deg,#06182b 0%,#0b2d4b 68%,#124353 100%)
  }
  .booking-hero::before{content:"";position:absolute;width:185px;height:185px;border:1px solid rgba(237,207,139,.16);border-radius:50%;right:-55px;top:-100px;box-shadow:0 0 0 28px rgba(237,207,139,.025),0 0 0 58px rgba(237,207,139,.018)}
  .booking-kicker{display:flex;align-items:center;gap:9px;margin:0 0 9px;color:var(--gold-2);font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
  .booking-kicker::before{content:"";width:24px;height:1px;background:var(--gold)}
  .booking-hero h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(29px,5.7vw,42px);font-weight:500;line-height:1.05;letter-spacing:-.03em;margin:0 0 10px;max-width:520px}
  .booking-hero p{position:relative;margin:0;color:rgba(255,255,255,.74);font-size:14px;max-width:510px}
  .booking-body{padding:25px 28px 28px}
  .calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
  .calendar-month{font-family:Georgia,"Times New Roman",serif;color:var(--navy);font-weight:600;font-size:21px}
  .calendar-nav{display:flex;gap:7px}
  .calendar-nav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:19px;cursor:pointer;transition:.16s}
  .calendar-nav button:hover{border-color:var(--gold);background:var(--cream);transform:translateY(-1px)}
  .date-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:23px}
  .date-choice{appearance:none;border:1px solid var(--line);background:#fff;border-radius:16px;min-height:84px;padding:9px 5px;color:var(--ink);cursor:pointer;transition:.17s;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .date-choice:hover{border-color:rgba(196,154,74,.72);box-shadow:0 8px 20px rgba(8,32,53,.08);transform:translateY(-2px)}
  .date-choice .dow{font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .date-choice .dom{font-family:Georgia,"Times New Roman",serif;font-size:26px;line-height:1.05;margin:3px 0 1px;color:var(--navy)}
  .date-choice .mon{font-size:10px;font-weight:800;text-transform:uppercase;color:#8a98a5}
  .date-choice.selected{background:linear-gradient(145deg,var(--navy),#0d3553);border-color:var(--gold);box-shadow:0 12px 25px rgba(6,24,43,.2);color:#fff}
  .date-choice.selected .dow,.date-choice.selected .mon{color:var(--gold-2)}
  .date-choice.selected .dom{color:#fff}
  .booking-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(215px,.85fr);gap:18px;align-items:start}
  .slot-head{display:flex;align-items:end;justify-content:space-between;gap:8px;margin-bottom:11px}
  .slot-head h2{font-size:14px;letter-spacing:.02em;margin:0;color:var(--navy)}
  .slot-head span{font-size:10px;color:var(--muted);font-weight:700}
  .slot-head span.live{display:inline-flex;align-items:center;gap:6px;color:#14777d}.slot-head span.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#20b889;box-shadow:0 0 0 4px rgba(32,184,137,.1)}
  .slot-head span.checking{display:inline-flex;align-items:center;gap:6px;color:#8b6625}.slot-head span.checking::before{content:"";width:7px;height:7px;border:2px solid rgba(196,154,74,.28);border-top-color:var(--gold);border-radius:50%;animation:availabilitySpin .8s linear infinite}
  @keyframes availabilitySpin{to{transform:rotate(360deg)}}
  .slot-legend{display:flex;gap:12px;align-items:center;margin:-2px 0 11px;font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .slot-legend span{display:flex;align-items:center;gap:5px}
  .slot-legend i{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(24,119,126,.1)}
  .slot-legend .off i{background:#b7bec3;box-shadow:none}
  .time-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .time-slot{position:relative;border:1px solid var(--line);background:#fff;border-radius:13px;min-height:46px;padding:11px 6px;font-size:12px;font-weight:850;color:var(--navy);cursor:pointer;transition:.16s}
  .time-slot.available::before{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--teal);right:7px;top:7px}
  .time-slot.available:hover{border-color:var(--teal);background:var(--teal-soft);transform:translateY(-1px)}
  .time-slot.selected{border-color:var(--teal);background:linear-gradient(135deg,var(--teal),#12646b);color:#fff;box-shadow:0 8px 20px rgba(24,119,126,.23)}
  .time-slot.selected::before{background:var(--gold-2)}
  .time-slot.unavailable{cursor:not-allowed;background:linear-gradient(145deg,#edf0f1,#f5f6f6);border-color:#e3e7e8;color:#a2aaaf;text-decoration:line-through;box-shadow:inset 0 1px rgba(255,255,255,.8)}
  .time-slot.unavailable::after{content:"Unavailable";display:block;margin-top:1px;font-size:7px;line-height:1;text-decoration:none;text-transform:uppercase;letter-spacing:.06em;color:#afb6ba}
  .summary-panel{position:relative;border:1px solid rgba(196,154,74,.38);border-radius:18px;padding:17px;background:linear-gradient(155deg,#fffdf7,#f8f4e9);box-shadow:0 10px 25px rgba(6,24,43,.07)}
  .summary-panel::before{content:"";position:absolute;left:16px;right:16px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .summary-label{margin:0 0 12px;font-size:9px;font-weight:950;letter-spacing:.15em;text-transform:uppercase;color:#8b6625}

<script>
/* ---------------------------------------------------------------

---------------------------------------------------------------- */
const QUESTIONS = [

      {label:"Severe — stops me doing things I love",ico:"😣", v:"Severe", p:18},

    ]
  },
  {
    id:"tried", key:"Tried so far", pts:15,
    eyebrow:"About your pain",
    q:"What have you already tried?",

  },

    id:"doctor", key:"Seen a doctor", pts:10,

    q:"Have you seen a doctor about this yet?",

      {label:"No, not yet",                         ico:"❌", v:"Not yet", p:6},

];

const MAX = QUESTIONS.reduce((s,q)=>s+q.pts,0); // 100
const answers = {};          // id -> chosen option

let step = -1;               // intro, questions, candidacy result, contact form, then booking

};

const stage = document.getElementById('stage');
const barFill = document.getElementById('barFill');
const stepLbl = document.getElementById('stepLbl');

function escHTML(value){
  return String(value==null?'':value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
}

function setProgress(){
  if(SCHEDULE_ONLY_MODE){
    barFill.style.width=lead.ready?"100%":"50%";
    stepLbl.textContent=lead.ready?"Choose a time":"Your details";
    return;
  }
  if(step<0){
    barFill.style.width="0%";
    stepLbl.textContent="About 60 seconds";
  }else if(step<QUESTIONS.length){
    const pct=Math.round((step/QUESTIONS.length)*100);
    barFill.style.width=pct+"%";
    stepLbl.textContent="Step "+(step+1)+" of "+QUESTIONS.length;
  }else{
    barFill.style.width="100%";
    stepLbl.textContent=step===QUESTIONS.length?"Your result":step===QUESTIONS.length+1?"Your details":"Choose a time";
  }
}

function renderIntro(){
  stage.innerHTML=`<div class="card intro-card">
    <p class="eyebrow">Private 60-second assessment</p>
    <h1>Joint pain shouldn’t control your life. Find out if a personalized path to relief may be right for you.</h1>
    <p class="sub">Answer six focused questions to see whether your symptoms and care history meet the initial criteria for a SYNVIA consultation.</p>
    <div class="intro-proof" aria-label="Quiz details">
      <span><b>✓</b> Six questions</span>
      <span><b>✓</b> Private</span>
      <span><b>✓</b> No obligation</span>
    </div>
    <button class="cta" type="button" id="startQuiz">Check my candidacy →</button>
    <p class="medical-note">This quiz is educational and does not diagnose a condition or guarantee treatment eligibility. Final candidacy is determined after a clinical evaluation.</p>
  </div>`;
  document.getElementById('startQuiz').addEventListener('click',()=>{step=0;render();});
  setProgress();
}

function renderQuestion(){
  const Q = QUESTIONS[step];
  const chosen = answers[Q.id];
  const optClass = Q.grid ? "grid" : "opts";
  let html = `<div class="card">
    <p class="eyebrow">${Q.eyebrow}</p>
    <h1 class="q">${Q.q}</h1>
    ${Q.sub?`<p class="sub">${Q.sub}</p>`:``}
    <div class="${optClass}">`;
  Q.options.forEach((o,i)=>{
    const sel = chosen && chosen.v===o.v ? "sel":"";
    html += `<button class="opt ${sel}" data-i="${i}">
        <span class="ico">${o.ico}</span>
        <span class="lbl">${o.label}</span>
        ${Q.grid?``:`<span class="tick"></span>`}
      </button>`;
  });
  html += `</div>
    ${Q.learn?`<div class="education-note"><span class="note-mark">i</span><span><b>Why we ask:</b> ${Q.learn}</span></div>`:``}
    <div class="nav">
      <button class="back" id="backBtn">← Back</button>
      <span class="hint">Tap an answer to continue</span>
    </div>
  </div>`;
  stage.innerHTML = html;

  stage.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const o = Q.options[+btn.dataset.i];
      answers[Q.id]=o;
      stage.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
      btn.classList.add('sel');
      setTimeout(()=>{ step++; render(); }, 230);
    });
  });
  const bb=document.getElementById('backBtn');
  if(bb) bb.addEventListener('click',()=>{ if(step>0){step--;render();}else{step=-1;render();} });
  setProgress();
}

/* tiny non-blocking notice (avoids native alert dialogs) */
function alertBox(msg){
  let n=document.getElementById('notice');
  if(!n){n=document.createElement('div');n.id='notice';
    n.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f2b33;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:99;max-width:90%;text-align:center";
    document.body.appendChild(n);}
  n.textContent=msg; n.style.opacity="1";
  clearTimeout(n._t); n._t=setTimeout(()=>{n.style.opacity="0";n.style.transition="opacity .4s";},2600);
}

function computeScore(){
  let total=0; const bd=[];
  QUESTIONS.forEach(Q=>{
    if(Q.pts===0) return;
    const a=answers[Q.id];
    const p=a?(a.p||0):0;
    total+=p;
    bd.push({k:Q.key, v:(a?a.v:'—'), p, max:Q.pts});
  });
  const pct=Math.round((total/MAX)*100);
  return {pct,bd};
}

function quizResultPayload(){
  const score=computeScore().pct;
  const resultAnswers={};
  QUESTIONS.forEach(question=>{resultAnswers[question.id]=answers[question.id]?.v||'';});
  const candidate=resultAnswers.tried!=="Nothing yet"&&score>=25;
  const tier=candidate?'Tier #1 - Candidate':'Tier #2 - Not a candidate';
  return {score,tier,candidate,answers:resultAnswers};
}

function localDateKey(date){
  const pad=n=>String(n).padStart(2,'0');
  return date.getFullYear()+"-"+pad(date.getMonth()+1)+"-"+pad(date.getDate());
}

function bookingDates(page){
  const dates=[];
  let remaining=Math.max(0,page)*5;
  const cursor=new Date();
  cursor.setHours(12,0,0,0);
  cursor.setDate(cursor.getDate()+1);
  while(dates.length<5){
    const day=cursor.getDay();
    if(day!==0&&day!==6){
      if(remaining>0) remaining--;
      else dates.push(new Date(cursor));
    }
    cursor.setDate(cursor.getDate()+1);
  }
  return dates;
}

function monthTitle(dates){
  const parts=[];
  dates.forEach(date=>{
    const label=date.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    if(!parts.includes(label)) parts.push(label);
  });
  return parts.join(' / ');
}

function longDate(date){
  return date.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}

function bookingAvailabilityState(dates){
  const key=localDateKey(dates[0])+"|"+localDateKey(dates[dates.length-1]);
  if(!BOOKING_AVAILABILITY_CACHE[key]){
    BOOKING_AVAILABILITY_CACHE[key]={status:location.protocol==='file:'?'preview':'loading',reserved:{}};
    if(location.protocol!=='file:') setTimeout(()=>loadBookingAvailability(key,dates),0);
  }
  return BOOKING_AVAILABILITY_CACHE[key];
}

async function loadBookingAvailability(key,dates){
  const state=BOOKING_AVAILABILITY_CACHE[key];
  if(!state||state.requested) return;
  state.requested=true;
  try{
    const query=new URLSearchParams({from:localDateKey(dates[0]),to:localDateKey(dates[dates.length-1])});
    const response=await fetch(BOOKING_REQUEST_ENDPOINT+"?"+query.toString(),{method:'GET',headers:{'Accept':'application/json'}});
    const data=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.error||'Availability unavailable');
    const reserved={};
    (Array.isArray(data.reserved)?data.reserved:[]).forEach(slot=>{
      if(!slot||!slot.date||!slot.time) return;
      if(!reserved[slot.date]) reserved[slot.date]=new Set();
      reserved[slot.date].add(slot.time);
    });
    state.status='ready';state.reserved=reserved;
  }catch(error){
    console.warn('Live availability:',error);
    state.status='fallback';state.reserved={};
  }
  if(document.querySelector('.booking-card')) renderBooking();
}

async function submitBookingRequest(){
  if(!bookingDate||!bookingTime||!bookingCommitted) return;
  if(!(AVAILABILITY_BY_DAY[bookingDate.getDay()]||[]).includes(bookingTime)){
    bookingTime="";
    renderBooking();
    return;
  }
  const button=document.getElementById('confirmBooking');
  button.disabled=true;
  button.textContent="Securing your request…";
  const quizResults=SCHEDULE_ONLY_MODE?{}:quizResultPayload();
  const request={
    action:"booking",
    name:lead.name||"",
    phone:lead.phone||"",
    email:lead.email||"",
    appointmentDate:localDateKey(bookingDate),
    appointmentTime:bookingTime,
    quizResults,
    source:FLOW_SOURCE,
    consent:true,
    attendanceCommitment:true,
    website:"",
    elapsedMs:Date.now()-bookingStartedAt
  };

  if(location.protocol==='file:'){
    renderBookingConfirmation("PREVIEW",false,true);
    return;
  }

  let synced=false;
  let emailed=false;
  let reference="";
  try{
    const response=await fetch(BOOKING_REQUEST_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(request)
    });
    const data=await response.json().catch(()=>({}));
    if(response.status===409){
      Object.keys(BOOKING_AVAILABILITY_CACHE).forEach(key=>delete BOOKING_AVAILABILITY_CACHE[key]);
      bookingTime="";
      renderBooking();
      alertBox(data.error||'That time was just reserved. Please choose another available time.');
      return;
    }
    if(!response.ok) throw new Error(data.error||'Scheduling sync failed');
    synced=true;
    reference=data.reference||"";
  }catch(error){
    console.warn('Command Center sync:',error);
  }

  try{
    const netlifyBody=new URLSearchParams({
      'form-name':'synvia-consultation-request',
      subject:'New SYNVIA consultation time request',
      name:request.name,
      phone:request.phone,
      email:request.email,
      appointment_date:request.appointmentDate,
      appointment_time:request.appointmentTime,
      source:SCHEDULE_ONLY_MODE?'SYNVIA direct scheduling link':'SYNVIA knee quiz calendar',
      attendance_commitment:'Confirmed: plans to attend and will contact SYNVIA to reschedule',
      consent:'Requested consultation scheduling follow-up'
    });
    const response=await fetch('/',{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:netlifyBody.toString()
    });
    emailed=response.ok;
  }catch(error){
    console.warn('Notification fallback:',error);
  }

  if(!synced&&!emailed){
    button.disabled=false;
    button.textContent="Request "+bookingTime+" →";
    alertBox("We couldn't send your request. Please call (972) 987-0114 and we'll reserve it for you.");
    return;
  }
  renderBookingConfirmation(reference,synced,false);
}

function calendarStamp(date,time,offsetMinutes=0){
  const match=String(time).match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if(!match) return "";
  let hour=Number(match[1]);
  const minute=Number(match[2]);
  if(hour===12) hour=0;
  if(match[3].toUpperCase()==='PM') hour+=12;
  const value=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate(),hour,minute));
  value.setUTCMinutes(value.getUTCMinutes()+offsetMinutes);
  const pad=n=>String(n).padStart(2,'0');
  return value.getUTCFullYear()+pad(value.getUTCMonth()+1)+pad(value.getUTCDate())+'T'+pad(value.getUTCHours())+pad(value.getUTCMinutes())+'00';
}

    'LOCATION:5850 Town & Country Blvd. Suite 1301 Frisco TX 75034',
    'END:VEVENT','END:VCALENDAR'

    try{
      await navigator.clipboard.writeText(appointmentDetails());
      alertBox('Appointment details copied.');
    }catch{
      alertBox('Please save the appointment details shown above.');
    }
  });
  barFill.style.width="100%";
  stepLbl.textContent=preview?"Preview":"Request received";
  window.scrollTo({top:0,behavior:'smooth'});

function render(){
  window.scrollTo({top:0,behavior:'smooth'});
  if(SCHEDULE_ONLY_MODE){
    if(lead.ready) renderBooking();
    else renderContact();
    return;
  }
  if(step<0) renderIntro();
  else if(step < QUESTIONS.length) renderQuestion();
  else if(step === QUESTIONS.length) renderEligibilityResult();
  else if(step === QUESTIONS.length+1) renderContact();
  else renderBooking();
}

render();
